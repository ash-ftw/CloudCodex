name: "🐛 Bug Report"
description: "File a report to help us reproduce and fix a bug in CloudCodeX"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: CloudCodeX Version / Commit
      description: What version or commit hash are you using?
      placeholder: "e.g., v1.0.0 or commit 8c0d6e5"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Add any relevant screenshots, terminal output, or browser console logs.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend / Monaco Editor
        - Backend / Express API
        - Real-Time Collaboration / Socket.IO
        - Docker Execution Sandbox
        - Git Worker
        - Supabase / Auth & Storage
        - Documentation / Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
